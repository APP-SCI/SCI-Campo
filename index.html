      <button class="btn small" data-act="croq-draw" data-bg="0" type="button">Dibujar croquis</button>
      ${has ? '<button class="btn small" data-act="croq-draw" data-bg="1" type="button">Dibujar sobre la imagen</button><button class="btn small ghost" data-act="croq-del" type="button">Quitar imagen</button>' : ''}</div>
    <div id="croquis-pad"></div></div>`;
}
function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('No se pudo leer la imagen.')); im.src = src; }); }
function imgToJpeg(src, max, q) {
  const w0 = src.naturalWidth || src.width, h0 = src.naturalHeight || src.height;
  const k = Math.min(1, max / Math.max(w0, h0)); const w = Math.round(w0 * k), h = Math.round(h0 * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(src, 0, 0, w, h);
  return { data: cv.toDataURL('image/jpeg', q), ext: 'jpeg', w, h };
}
async function loadCroquis(file) {
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast('Seleccione un archivo de imagen (JPG o PNG).'); return; }
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImg(url);
    forms(view.code)[view.idx || 0].croquis = imgToJpeg(im, 1600, 0.82);
    save(); view.keepScroll = window.scrollY; render(); toast('Imagen del croquis cargada.');
  } catch (e) { toast(e.message); } finally { URL.revokeObjectURL(url); }
}
const Pad = { strokes: [], color: '#D32F2F', width: 4, bg: null, cv: null };
async function padOpen(withBg) {
  const f = forms(view.code)[view.idx || 0];
  Pad.strokes = []; Pad.bg = null;
  if (withBg && f.croquis?.data) { try { Pad.bg = await loadImg(f.croquis.data); } catch (e) {} }
  const W = 1400, H = Pad.bg ? Math.round(W * Pad.bg.height / Pad.bg.width) : 980;
  const colors = [['#1B2430', 'negro'], ['#D32F2F', 'rojo'], ['#1565C0', 'azul'], ['#2E7D32', 'verde'], ['#EF8A00', 'naranja']];
  const host = $('#croquis-pad');
  host.innerHTML = `<div class="pad"><div class="tools">${colors.map(([c, l]) => `<button class="swatch" data-act="pad-color" data-c="${c}" style="background:${c}" aria-label="Color ${l}" aria-pressed="${c === Pad.color}" type="button"></button>`).join('')}
      <button class="btn small" data-act="pad-width" data-w="4" aria-pressed="${Pad.width === 4}" type="button">Fino</button><button class="btn small" data-act="pad-width" data-w="10" aria-pressed="${Pad.width === 10}" type="button">Grueso</button>
      <button class="btn small" data-act="pad-undo" type="button">Deshacer</button><button class="btn small ghost" data-act="pad-clear" type="button">Borrar trazos</button></div>
    <canvas id="pad-cv" width="${W}" height="${H}" aria-label="Área de dibujo del croquis"></canvas>
    <p class="note">Dibuje con el dedo o el mouse. Sugerencia: rojo para el punto del incidente, azul para cuerpos de agua, negro para vías e instalaciones.</p>
    <div class="row"><button class="btn small primary" data-act="pad-save" type="button">Guardar croquis</button><button class="btn small ghost" data-act="pad-cancel" type="button">Cancelar</button></div></div>`;
  const cv = Pad.cv = $('#pad-cv');
  let cur = null;
  const pt = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} const r = cv.getBoundingClientRect(); cur = { c: Pad.color, w: Pad.width * cv.width / Math.max(240, r.width), p: [pt(e)] }; Pad.strokes.push(cur); padDraw(); });
  cv.addEventListener('pointermove', (e) => { if (!cur) return; e.preventDefault(); cur.p.push(pt(e)); padDraw(); });
  const end = () => { cur = null; }; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
  padDraw(); host.scrollIntoView({ block: 'nearest' });
}
function padDraw() {
  const cv = Pad.cv; if (!cv) return; const cx = cv.getContext('2d');
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
  if (Pad.bg) cx.drawImage(Pad.bg, 0, 0, cv.width, cv.height);
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  for (const s of Pad.strokes) {
    cx.strokeStyle = s.c; cx.fillStyle = s.c; cx.lineWidth = s.w;
    if (s.p.length === 1) { cx.beginPath(); cx.arc(s.p[0][0], s.p[0][1], s.w / 2, 0, Math.PI * 2); cx.fill(); continue; }
    cx.beginPath(); cx.moveTo(s.p[0][0], s.p[0][1]); for (const [x, y] of s.p.slice(1)) cx.lineTo(x, y); cx.stroke();
  }
}
function padSave() {
  if (!Pad.cv) return;
  if (!Pad.strokes.length && !Pad.bg) { toast('Dibuje algo antes de guardar.'); return; }
  forms(view.code)[view.idx || 0].croquis = { ...imgToJpeg(Pad.cv, 1600, 0.85), drawn: true };
  Pad.cv = null; save(); view.keepScroll = window.scrollY; render(); toast('Croquis guardado. Se insertará en la página 3 del SCI 201.');
}

// ------------------------------------------------------------------ pronóstico (Open-Meteo, gratuito y sin clave)
function parseCoords(s) {
  if (!s) return null;
  const nums = [...String(s).matchAll(/(-?\d+(?:[.,]\d+)?)\s*°?\s*([NSEWOnseow])?/g)].map((m) => { let v = parseFloat(m[1].replace(',', '.')); const h = (m[2] || '').toUpperCase(); if (h === 'S' || h === 'W' || h === 'O') v = -Math.abs(v); return v; });
  if (nums.length < 2) return null;
  const [lat, lon] = nums; if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return { lat, lon };
}
async function meteo() {
  const c = inc().common; const p = geoDecimal(c) || parseCoords(c.coords);
  if (!p) { toast('Ingrese las coordenadas geográficas del sitio en los datos del incidente.'); return; }
  toast('Consultando pronóstico…');
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&hourly=temperature_2m,precipitation_probability,precipitation,wind_speed_10m,wind_direction_10m,relative_humidity_2m&timezone=auto&forecast_days=3`;
    const r = await fetch(url); if (!r.ok) throw new Error('servicio no disponible (' + r.status + ')');
    const j = await r.json(); const h = j.hourly;
    const ini = c.poIni || nowDT(), fin = c.poFin || dtAdd(today(), nowHM(), 720);
    const idx = h.time.map((t, i) => [t, i]).filter(([t]) => t >= ini.slice(0, 13) && t <= fin).map(([, i]) => i);
    if (!idx.length) throw new Error('el periodo está fuera del rango del pronóstico');
    const pick = (k) => idx.map((i) => h[k][i]).filter((x) => x != null);
    const T = pick('temperature_2m'), PP = pick('precipitation_probability'), PR = pick('precipitation'), W = pick('wind_speed_10m'), D = pick('wind_direction_10m'), RH = pick('relative_humidity_2m');
    const avg = (a) => a.reduce((x, y) => x + y, 0) / a.length;
    const sx = avg(D.map((d) => Math.sin(d * Math.PI / 180))), cx = avg(D.map((d) => Math.cos(d * Math.PI / 180)));
    const dir = ((Math.atan2(sx, cx) * 180 / Math.PI) + 360) % 360;
    const rosa = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'][Math.round(dir / 45) % 8];
    const txt = `Periodo ${SCIMaps.fDT(ini)} a ${SCIMaps.fDT(fin)}: temperatura ${Math.min(...T).toFixed(0)}–${Math.max(...T).toFixed(0)} °C; humedad ${Math.min(...RH)}–${Math.max(...RH)} %; probabilidad de lluvia hasta ${Math.max(...PP)} % (acumulado ${PR.reduce((a, b) => a + b, 0).toFixed(1)} mm); viento promedio ${avg(W).toFixed(0)} km/h (máx. ${Math.max(...W).toFixed(0)}) proveniente del ${rosa}. Fuente: Open-Meteo, consultado ${SCIMaps.fDT(nowDT())}.`;
    const f = forms(view.code)[view.idx || 0]; f.pronostico = txt; save(); view.keepScroll = window.scrollY; render(); toast('Pronóstico agregado.');
  } catch (e) { toast(netMsg(e, 'el pronóstico'), 6000); }
}
function gps() {
  if (!navigator.geolocation) { toast('Este dispositivo no permite obtener la ubicación.'); return; }
  toast('Obteniendo ubicación…');
  navigator.geolocation.getCurrentPosition((pos) => {
    setGeoFromDecimal(inc().common, pos.coords.latitude, pos.coords.longitude); save();
    if (view.name === 'setup') { view.keepScroll = window.scrollY; render(); }
    toast('Coordenadas tomadas del GPS (±' + Math.round(pos.coords.accuracy) + ' m).');
  }, (err) => toast('No se pudo obtener la ubicación: ' + (err.code === 1 ? 'permiso denegado.' : err.message) + ' Escríbalas a mano.', 5000), { enableHighAccuracy: true, timeout: 15000 });
}

// ------------------------------------------------------------------ exportación
function b64ToBuf(b64) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
function getTpl(code) { try { const x = localStorage.getItem('sci-tpl-' + code); if (x) return x; } catch (e) {} return TEMPLATES[code]; }
function fileBase() { const c = inc().common; return ((c.codigo || c.nombre || 'incidente').replace(/[^\w\-]+/g, '_').slice(0, 40) || 'incidente') + '_' + today().replace(/-/g, '') + '-' + nowHM().replace(':', ''); }
async function buildXlsx(code, f) {
  const t = getTpl(code); if (!t) throw new Error('No se encontró la plantilla del SCI ' + code);
  const wb = await XLSXEngine.Workbook.load(b64ToBuf(t));
  await wb.fill(SCIMaps.MAPS[code](inc().common, f));
  return wb.toBlob();
}
async function doExport(code, idx, kind) {
  const f = forms(code)[idx];
  const suffix = FORMS[code].multi && forms(code).length > 1 ? `_${idx + 1}` : '';
  try {
    if (kind === 'xlsx') await saveFile(`SCI_${code}${suffix}_${fileBase()}.xlsx`, await buildXlsx(code, f));
    else await saveFile(`SCI_${code}${suffix}_${fileBase()}.html`, new Blob([printHTML(code, f)], { type: 'text/html' }));
  } catch (e) { toast('No se pudo generar el archivo: ' + e.message, 6000); }
}
async function zipAll(b) {
  const I = inc(), P = PERIODS[I.period];
  b.disabled = true; const old = b.textContent; b.textContent = 'Preparando…';
  try {
    const files = [];
    const codes = [...P.forms, ...P.extra.filter((c) => I.forms[c])];
    for (const code of codes) {
      const all = forms(code);
      for (let i = 0; i < all.length; i++) {
        const sfx = all.length > 1 ? `_${i + 1}` : '';
        if (FORMS[code].noTemplate) files.push({ name: `SCI_${code}${sfx}.html`, blob: new Blob([printHTML(code, all[i])], { type: 'text/html' }) });
        else files.push({ name: `SCI_${code}${sfx}.xlsx`, blob: await buildXlsx(code, all[i]) });
      }
    }
    await saveFile(`SCI_${I.period}_${fileBase()}.zip`, await XLSXEngine.zipFiles(files));
  } catch (e) { toast('No se pudo generar el paquete: ' + e.message, 6000); }
  b.disabled = false; b.textContent = old;
}
let dlNS;
async function saveFile(name, blob) {
  if (IN_CLAUDE) {
    if (dlNS === undefined) { try { dlNS = await window.claude.use('downloads'); } catch (e) { dlNS = null; } }
    if (dlNS) { try { await dlNS.save({ filename: name, data: blob }); toast('Archivo listo: ' + name); } catch (e) { if (e?.code !== 'declined') toast('No se pudo guardar: ' + (e?.message || e)); } return; }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); toast('Descargado: ' + name);
}
function printHTML(code, f) {
  const I = inc(), c = I.common, F = FORMS[code];
  const val = (x) => esc(x ?? '').replace(/\n/g, '<br>');
  const fmt = (fd, x) => fd.t === 'date' ? SCIMaps.fDate(x) : fd.t === 'datetime' ? SCIMaps.fDT(x) : fd.t === 'select' || fd.t === 'seg' ? ((fd.opts.find((o) => o.v === x) || {}).l || x) : x;
  const secs = SCHEMA[code].map((s) => {
    const fields = s.fields === 'PREP' ? PREP : s.fields;
    const inner = fields.map((fd) => {
      if (fd.t === 'rows') { const arr = (getP(f, fd.k) || []).filter((r) => Object.values(r).some((x) => x)); if (!arr.length) return '';
        return `<table><thead><tr><th>#</th>${fd.cols.map((cd) => `<th>${esc(cd.l)}</th>`).join('')}</tr></thead><tbody>${arr.map((r, i) => `<tr><td>${i + 1}</td>${fd.cols.map((cd) => `<td>${val(fmt(cd, r[cd.k]))}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
      if (fd.t === 'check221') return SCIMaps.CHK221.map((s2) => { const key = s2.signSec || s2.sec; return `<h3>${esc(s2.title)}</h3><ul>${s2.items.map(([id, , t, sub]) => `<li style="${sub ? 'margin-left:20px' : ''}">${f.checks?.[id] ? '☑' : '☐'} ${esc(t)}</li>`).join('')}</ul>${s2.done ? `<p>${f.completo?.[key] ? '☑' : '☐'} Completado · Firma: ${val(f.firma?.[key])}</p><p>Observaciones: ${val(f.obs?.[key])}</p>` : ''}`; }).join('');
      let x = getP(f, fd.k); if (!x && fd.fromC) x = c[fd.fromC]; if (!x && typeof fd.from === 'string') x = getP(c, fd.from);
      return `<tr><th>${esc(fd.l)}</th><td>${val(fmt(fd, x))}</td></tr>`;
    }).join('');
    return `<section><h2>${esc(s.title)}</h2>${/<tr><th>/.test(inner) ? '<table class="kv">' + inner.replace(/(<table>[\s\S]*?<\/table>)/g, '</table>$1<table class="kv">') + '</table>' : inner}</section>`;
  }).join('');
  return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCI ${code} – ${esc(c.nombre || '')}</title>
<style>body{font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#111;margin:24px;max-width:900px}header{display:grid;grid-template-columns:1fr auto;border:1.5px solid #3E4B5E;margin-bottom:12px}header div{padding:8px 10px}header .r{border-left:1.5px solid #3E4B5E;text-align:center;font-weight:bold}h1{font-size:14px;margin:0}h2{background:#3E4B5E;color:#fff;font-size:12px;padding:5px 8px;margin:14px 0 0;text-transform:uppercase}h3{font-size:12px;margin:10px 0 4px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #9aa;padding:4px 6px;text-align:left;vertical-align:top}table.kv th{width:32%;background:#f1f3f5}thead th{background:#f1f3f5}ul{margin:4px 0;padding-left:16px;list-style:none}@media print{body{margin:10mm}h2{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body>
<header><div><h1>FORMATO DE SISTEMA COMANDO DE INCIDENTES<br>FORMULARIO SCI ${code} – ${esc(F.name.toUpperCase())}</h1><div>${esc(F.hses)}</div></div><div class="r">INFORMACIÓN<br>CLASIFICADA</div></header>
<section><h2>1. Identificación del incidente</h2><table class="kv"><tr><th>Nombre de la infraestructura</th><td>${val(c.infra)}</td></tr><tr><th>Código único del evento</th><td>${val(c.codigo)}</td></tr><tr><th>Nombre del incidente</th><td>${val(c.nombre)}</td></tr><tr><th>Periodo operacional N.º ${val(c.poNo)}</th><td>${val(SCIMaps.fDT(c.poIni))} a ${val(SCIMaps.fDT(c.poFin))}</td></tr></table></section>
${secs}${code === '201' && f.croquis?.data ? `<section><h2>15. Mapa situacional o croquis</h2><img src="${f.croquis.data}" alt="Croquis" style="max-width:100%;border:1px solid #9aa"></section>` : ''}${code === '201' || code === '202' ? `<section><h2>${code === '201' ? '16. Organización actual' : '15. Organigrama para el periodo operacional'}</h2><div style="border:1px solid #9aa;padding:6px">${orgSVG(c, true)}</div></section>` : ''}<p style="margin-top:16px;color:#555">Generado con SCI Campo (Indo_Sea) el ${esc(SCIMaps.fDT(nowDT()))}. Para PDF: Archivo › Imprimir › Guardar como PDF.</p></body></html>`;
}

// ------------------------------------------------------------------ respaldo y plantillas
function importJSON(file) {
  if (!file) return; const rd = new FileReader();
  rd.onload = () => { try { const j = JSON.parse(rd.result); const I = j.incident; if (!I?.common) throw new Error('archivo sin incidente'); I.id = I.id && !S.incidents[I.id] ? I.id : Date.now().toString(36); S.incidents[I.id] = I; S.current = I.id; save(); view = { name: 'panel' }; render(); toast('Incidente importado.'); } catch (e) { toast('No se pudo importar: ' + e.message); } };
  rd.readAsText(file);
}
function loadTemplate(code, file) {
  if (!file) return; const rd = new FileReader();
  rd.onload = async () => {
    try { const buf = rd.result; const wb = await XLSXEngine.Workbook.load(buf); const sh = await wb.sheets(); const need = Object.keys(SCIMaps.MAPS[code](inc()?.common || {}, newForm(code)));
      const miss = need.filter((n) => !sh[n]); if (miss.length) throw new Error('faltan las hojas: ' + miss.join(', '));
      const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768));
      localStorage.setItem('sci-tpl-' + code, btoa(s)); view.keepScroll = window.scrollY; render(); toast('Plantilla del SCI ' + code + ' actualizada.');
    } catch (e) { toast('Plantilla no válida: ' + e.message, 6000); } };
  rd.readAsArrayBuffer(file);
}
