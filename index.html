<style>
/* Layout: consola de campo — barra de estado fija arriba (incidente + reloj H+), una columna,
   cada sección como una "hoja" con banda de encabezado igual a la de los formatos SCI en papel. */
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --surface-2:#F5F7F6; --ink:#18212B; --muted:#56616D; --line:#C9D1CE;
  --band:#3E4B5E; --band-ink:#FFFFFF; --accent:#E0912F; --accent-ink:#1A1206; --accent-soft:#FBEBD5;
  --ok:#2E7A4C; --ok-soft:#DDEFE3; --warn:#9A6412; --warn-soft:#FBEFD6; --danger:#B3261E; --danger-soft:#F8DEDB;
  --focus:#1F6FEB;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161C; --surface:#1A2129; --surface-2:#151B22; --ink:#E6EBEF; --muted:#9BA7B3; --line:#2E3946;
  --band:#2B3849; --band-ink:#EEF2F6; --accent:#F0A24A; --accent-ink:#1A1206; --accent-soft:#3A2A14;
  --ok:#6CC28E; --ok-soft:#183324; --warn:#E5B25C; --warn-soft:#3A2D12; --danger:#F08C84; --danger-soft:#3D1A18;
  --focus:#6EA8FE; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#1A2129; --surface-2:#151B22; --ink:#E6EBEF; --muted:#9BA7B3; --line:#2E3946;
  --band:#2B3849; --band-ink:#EEF2F6; --accent:#F0A24A; --accent-ink:#1A1206; --accent-soft:#3A2A14;
  --ok:#6CC28E; --ok-soft:#183324; --warn:#E5B25C; --warn-soft:#3A2D12; --danger:#F08C84; --danger-soft:#3D1A18;
  --focus:#6EA8FE; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:940px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barra de estado */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-ink)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:56px}
.brand{text-align:left;font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;letter-spacing:.06em;opacity:.8}
.topbar .inc{flex:1;min-width:0;font-size:.9rem;line-height:1.25}
.topbar .inc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{text-align:right;line-height:1.1}
.clock .h{font-family:var(--f-mono);font-size:1.25rem}
.clock .p{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.iconbtn{background:transparent;border:1px solid color-mix(in srgb,var(--band-ink) 35%,transparent);color:inherit;border-radius:var(--r);min-height:40px;padding:0 12px;cursor:pointer;font-weight:600}

main{padding-block:20px 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:2rem;line-height:1.05}
h2{font-size:1.5rem}
.lead{color:var(--muted);max-width:62ch;margin:.4rem 0 0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:.88rem}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:500}

/* Selección de periodo */
.periods{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.period{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.period:hover{border-color:var(--accent)}
.period .range{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.period h2{font-size:1.7rem}
.timeline{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden}
.timeline i{position:absolute;top:0;bottom:0;background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:.78rem;padding:3px 8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}

/* Listas */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.item{display:flex;gap:14px;align-items:center;padding:14px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;color:var(--ink);width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item .code{font-family:var(--f-mono);font-size:.95rem;min-width:64px;padding:6px 0;text-align:center;border-radius:4px;background:var(--band);color:var(--band-ink)}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-size:1.05rem}
.item .txt span{display:block;color:var(--muted);font-size:.86rem}
.pill{font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.pend{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.prog{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.arrow{color:var(--muted);font-size:1.3rem}

/* Hojas del formulario */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sheet>header{background:var(--band);color:var(--band-ink);padding:9px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sheet>header h3{font-size:1.08rem;letter-spacing:.03em;text-transform:uppercase}
.sheet .body{padding:16px;display:flex;flex-direction:column;gap:14px}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label,.f>.lbl{font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.f input:not([type=checkbox]):not([type=radio]),.f select,.f textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);font-size:16px}
.f textarea{min-height:88px;max-height:340px;resize:vertical;line-height:1.4;field-sizing:content}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--focus);background:var(--surface);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.qa{font-size:.82rem;color:var(--warn);margin:0}
.qa:empty{display:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);cursor:pointer;font-weight:500}
.seg input{accent-color:var(--accent);width:18px;height:18px}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);cursor:pointer;font-weight:500}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.toggle:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

.rowcard{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:12px;display:flex;flex-direction:column;gap:10px}
.rowcard .rh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rowcard .rh b{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.02em}
.rowcard .f input:not([type=checkbox]),.rowcard .f select,.rowcard .f textarea{background:var(--surface)}
.rows{display:flex;flex-direction:column;gap:10px}

.auto{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.auto dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px 16px;margin:0}
.auto dt{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.auto dd{margin:0;font-weight:500;overflow-wrap:anywhere}

/* Asistente */
.ai{border:2px solid var(--accent);border-radius:10px;background:var(--accent-soft);padding:14px;display:flex;flex-direction:column;gap:12px}
.ai h4{margin:0;font-family:var(--f-display);font-size:1.2rem;letter-spacing:.02em}
.ai .f input:not([type=checkbox]),.ai .f select{background:var(--surface)}
.prop{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.prop input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
.prop .pr{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.prop p{margin:2px 0;white-space:pre-line}
.prop .o{font-weight:600}
.prop small{color:var(--muted);display:block}
.prop details summary{cursor:pointer;color:var(--muted);font-size:.88rem}

.orgprev{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px;overflow-x:auto}
.orgprev svg{min-width:520px}
.orgpos{display:flex;flex-direction:column;gap:6px}
.brandline{font-size:.8rem;color:var(--muted);letter-spacing:.04em;margin:0}
.brandline b{font-family:var(--f-display);letter-spacing:.06em;color:var(--ink)}
.geo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.geo{flex-wrap:nowrap}
.geo .geo-l{flex-basis:100%;font-weight:600;font-size:.9rem}
.geo-wrap{display:flex;flex-direction:column;gap:4px}
.geo input{width:56px!important;min-width:0;text-align:center;padding:10px 4px!important}
.geo input.sec{width:72px!important}
.geo select{width:auto!important;min-width:60px;padding:10px 6px!important}
.geo span.u{color:var(--muted);font-family:var(--f-mono)}
.dict{border:2px solid var(--focus);border-radius:10px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.dict .live{display:flex;align-items:center;gap:8px;font-weight:600}
.dict .dot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.25}}
.dict .interim{color:var(--muted);font-style:italic;min-height:1.2em;margin:0}
.badge{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:999px}
.badge.local{background:var(--ok-soft);color:var(--ok)}
.badge.cloud{background:var(--warn-soft);color:var(--warn)}
.btn svg{width:16px;height:16px;flex:none}
.croq{display:flex;flex-direction:column;gap:10px}
.croq img{max-width:100%;max-height:320px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff;align-self:flex-start}
.pad{display:flex;flex-direction:column;gap:8px;border:2px solid var(--accent);border-radius:10px;padding:10px;background:var(--surface)}
.pad canvas{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair}
.pad .tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{outline:3px solid var(--focus);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.check221 .it{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check221 .it input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin-top:1px}
.check221 .sub{padding-left:32px}

.banner{border-radius:8px;padding:12px 14px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{min-height:38px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.tab[aria-selected="true"]{background:var(--band);color:var(--band-ink);border-color:var(--band)}

.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.actionbar .wrap{display:flex;gap:10px;flex-wrap:wrap;padding-block:10px}
.actionbar .btn{flex:1 1 160px}
@media (max-width:560px){.actionbar .wrap{gap:6px}.actionbar .btn{flex:1 1 0;min-width:0;padding:0 8px;font-size:.84rem;line-height:1.15;text-align:center}}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;max-width:min(92vw,520px);font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.note{font-size:.85rem;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:8px;background:var(--danger-soft)}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}
@media (max-width:560px){h1{font-size:1.6rem}.brand small{display:none}.topbar .wrap{flex-wrap:wrap;row-gap:4px}.topbar .inc{order:5;flex-basis:100%;font-size:.82rem;display:flex;gap:8px;align-items:baseline}.topbar .inc:empty{display:none}.topbar .inc b{flex:1;min-width:0}.clock{margin-left:auto}.clock .h{font-size:1.05rem}
  .item{gap:10px;padding:12px}.item .code{min-width:56px;font-size:.82rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* =====================================================================
   SCI Campo · Indo_Sea
   © 2026 Indo_Sea. Todos los derechos reservados.

   Motor XLSX sin dependencias.
   Abre una plantilla .xlsx, escribe valores en celdas por hoja y genera
   un nuevo .xlsx conservando logos, estilos, bordes y celdas combinadas.
   Funciona en navegador (Chrome, Edge, Safari 16.4+, Firefox 113+) y Node 18+.
   ===================================================================== */
const XLSXEngine = (() => {
  const td = new TextDecoder('utf-8');
  const te = new TextEncoder();

  // ---------- CRC32 ----------
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8) {
    let c = 0xffffffff;
    for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  async function streamBytes(u8, stream) {
    const out = new Blob([u8]).stream().pipeThrough(stream);
    return new Uint8Array(await new Response(out).arrayBuffer());
  }
  const inflateRaw = (u8) => streamBytes(u8, new DecompressionStream('deflate-raw'));
  const deflateRaw = (u8) => streamBytes(u8, new CompressionStream('deflate-raw'));

  // ---------- Lectura ZIP ----------
  function readZip(buf) {
    const u8 = new Uint8Array(buf);
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('El archivo no es un Excel válido (.xlsx)');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const entries = [];
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('ZIP dañado');
      const flags = dv.getUint16(p + 8, true);
      const method = dv.getUint16(p + 10, true);
      const time = dv.getUint16(p + 12, true);
      const date = dv.getUint16(p + 14, true);
      const crc = dv.getUint32(p + 16, true);
      const csize = dv.getUint32(p + 20, true);
      const usize = dv.getUint32(p + 24, true);
      const nlen = dv.getUint16(p + 28, true);
      const xlen = dv.getUint16(p + 30, true);
      const clen = dv.getUint16(p + 32, true);
      const loff = dv.getUint32(p + 42, true);
      const name = td.decode(u8.subarray(p + 46, p + 46 + nlen));
      const lnlen = dv.getUint16(loff + 26, true);
      const lxlen = dv.getUint16(loff + 28, true);
      const start = loff + 30 + lnlen + lxlen;
      entries.push({ name, flags, method, time, date, crc, csize, usize, raw: u8.subarray(start, start + csize) });
      p += 46 + nlen + xlen + clen;
    }
    return entries;
  }

  async function entryBytes(e) {
    if (e.data) return e.data;
    if (e.method === 0) return e.raw;
    if (e.method === 8) return inflateRaw(e.raw);
    throw new Error('Compresión no soportada: ' + e.method);
  }

  // ---------- Escritura ZIP ----------
  async function writeZip(entries) {
    const parts = [];
    const central = [];
    let offset = 0;
    const now = new Date();
    const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    for (const e of entries) {
      let raw, method, crc, csize, usize, time = e.time ?? dosTime, date = e.date ?? dosDate;
      if (e.data) {
        usize = e.data.length;
        crc = crc32(e.data);
        const comp = await deflateRaw(e.data);
        if (comp.length < usize) { raw = comp; method = 8; } else { raw = e.data; method = 0; }

      const rel = rels && [...rels.matchAll(/<Relationship\b[^>]*>/g)].map((m) => m[0]).find((r) => r.includes(`Id="${rid}"`));

const SCIAI = (() => {

    } },
  ];
  const TIPOS = Object.assign({}, ...TIPO_GRUPOS.map((x) => x.items));
  const PRODUCTOS = {
    crudo: 'Petróleo crudo', gasolina: 'Gasolina / nafta', diesel: 'Diésel / ACPM', jet: 'Jet / queroseno',
    glp: 'GLP', gas: 'Gas natural', otro: 'Otro / no aplica',
  };

  const SPILL = ['derrame_tierra', 'derrame_agua', 'valvula_ilicita', 'atentado', 'falla_integridad', 'accidente_carrotanque', 'incendio_derrame'];
  const FIRE = ['incendio_derrame', 'incendio_tanque', 'incendio_estacion', 'explosion', 'incendio_forestal'];
  const SOCIAL = ['bloqueo_comunidad', 'paro_gremial', 'invasion_dv', 'orden_publico', 'hurto_vandalismo'];
  const NATURAL = ['alerta_lluvias', 'inundacion', 'remocion_masa', 'socavacion', 'tormenta', 'sismo'];
  const HOSTIL = ['valvula_ilicita', 'atentado', 'orden_publico', 'hurto_vandalismo'];

  /** ¿El evento implica pérdida de contención? Se puede forzar con ctx.perdida. */
  const spillDefault = (tipo) => SPILL.includes(tipo);
  function fam(ctx) {
    const t = ctx.tipo;
    const perdida = typeof ctx.perdida === 'boolean' ? ctx.perdida : spillDefault(t);
    const fire = FIRE.includes(t) || !!ctx.ignicion;
    const gas = t === 'fuga_gas' || (perdida && isGas(ctx.producto));
    return {
      perdida: perdida && !gas, gas, fire,
      social: SOCIAL.includes(t), natural: NATURAL.includes(t), oper: t === 'alerta_operacional',
      terceros: t === 'dano_terceros', medica: t === 'accidente_personal', hostil: HOSTIL.includes(t) || t === 'orden_publico',
      hazmat: perdida || gas || fire,
    };
  }

  const isGas = (p) => p === 'glp' || p === 'gas';
  function erg(ctx) {
    if (isGas(ctx.producto)) return { guia: 'GRE guía 115', inicial: 100, grande: 800, fuego: 1600 };
    return { guia: 'GRE guía 128', inicial: 50, grande: 300, fuego: 800 };
  }
  function addMin(hhmm, min) {
    const m = /^(\d{1,2}):(\d{2})/.exec(hhmm || '');
    if (!m) return null;
    let t = (+m[1]) * 60 + (+m[2]) + min;
    t = ((t % 1440) + 1440) % 1440;
    return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  }
  /** Contracciones del español: de el → del, a el → al. */
  const gram = (t) => String(t || '').replace(/\bde el\b/g, 'del').replace(/\ba el\b/g, 'al');
  const bullets = (arr) => arr.filter(Boolean).map((x) => '• ' + x).join('\n');
  const cmgrd = (ctx) => (ctx.municipio && !ctx.anonimoMun ? `CMGRD de ${ctx.municipio}` : 'CMGRD local');
  const bomberos = (ctx) => (ctx.municipio && !ctx.anonimoMun ? `Cuerpo de Bomberos de ${ctx.municipio}` : 'Cuerpo de Bomberos local');

  // ---------------------------------------------------------------- evaluación inicial
  function evaluacion(ctx) {
    const e = erg(ctx), F = fam(ctx);
    const prod = ctx.producto === 'glp' ? 'GLP' : (PRODUCTOS[ctx.producto] || 'hidrocarburo').toLowerCase();
    const lugar = ctx.infra || 'el sitio';
    const vol = ctx.volumen ? ` Volumen estimado: ${ctx.volumen}.` : '';
    const nat = {
      derrame_tierra: `Pérdida de contención de ${prod} en ${lugar}, con afectación de suelo.${vol}`,
      derrame_agua: `Pérdida de contención de ${prod} en ${lugar} que alcanza ${ctx.agua || 'un cuerpo de agua'}.${vol}`,
      valvula_ilicita: `Pérdida de contención de ${prod} por válvula ilícita instalada en ${lugar}.${vol}`,
      atentado: `Atentado contra la infraestructura en ${lugar} con pérdida de contención de ${prod}.${vol}`,
      falla_integridad: `Pérdida de contención de ${prod} por falla de integridad de la tubería en ${lugar}.${vol}`,
      accidente_carrotanque: `Accidente de carrotanque con ${prod} en ${lugar}.${vol}`,
      incendio_derrame: `Incendio de ${prod} derramado (piscina de fuego) en ${lugar}.${vol}`,
      incendio_tanque: `Incendio en tanque de almacenamiento de ${prod} en ${lugar}.${vol}`,
      incendio_estacion: `Incendio en instalaciones de ${lugar} (área de proceso / cuarto de bombas).`,
      explosion: `Explosión en ${lugar} con posible incendio y daño estructural.`,
      incendio_forestal: `Incendio de cobertura vegetal que amenaza el derecho de vía o instalaciones en ${lugar}.`,
      fuga_gas: `Fuga de ${prod} sin ignición en ${lugar}, con formación de atmósfera inflamable.`,
      bloqueo_comunidad: `Bloqueo de vías, accesos o instalaciones por parte de la comunidad en ${lugar}, que impide la operación o el ingreso de personal.`,
      paro_gremial: `Paro gremial / de transportadores que afecta la movilidad, el abastecimiento y la operación en ${lugar}.`,
      invasion_dv: `Ocupación o intervención del derecho de vía por terceros en ${lugar}.`,
      orden_publico: `Alteración del orden público o amenaza de grupos armados en el área de ${lugar}.`,
      hurto_vandalismo: `Hurto o vandalismo de equipos o infraestructura en ${lugar}.`,
      alerta_operacional: `Alerta operacional en ${lugar} (variación anormal de presión o caudal, paro no programado o falla de supervisión).`,
      alerta_lluvias: `Alerta por lluvias intensas y posible creciente súbita en el área de ${lugar}.`,
      inundacion: `Inundación / avenida torrencial que afecta el derecho de vía o instalaciones en ${lugar}.`,
      remocion_masa: `Movimiento en masa (deslizamiento) que compromete la tubería en ${lugar}.`,
      socavacion: `Socavación con exposición de la tubería en el cruce de ${ctx.agua || 'cauce'} en ${lugar}.`,
      tormenta: `Tormenta eléctrica / vendaval en el área de ${lugar}.`,
      sismo: `Sismo con posible afectación de la infraestructura en ${lugar}.`,
      dano_terceros: `Daño a la tubería por terceros (maquinaria o excavación) en ${lugar}.`,
      accidente_personal: `Accidente laboral / emergencia médica en ${lugar}.`,
    }[ctx.tipo] || `Emergencia en ${lugar}.${vol}`;
    const vict = ctx.victimas ? ` Víctimas reportadas: ${ctx.nVictimas || 'por confirmar'}.` : ' Sin víctimas reportadas.';

    const am = [];
    if (F.gas) am.push('Nube de vapor inflamable / explosiva', ctx.producto === 'glp' ? 'Riesgo de BLEVE y quemaduras por frío' : 'Asfixia por desplazamiento de oxígeno');
    else if (F.perdida) am.push('Vapores inflamables (atmósfera explosiva)', ctx.producto === 'crudo' ? 'Posible presencia de H2S y BTEX' : 'Vapores tóxicos (BTEX)', 'Superficies resbaladizas');
    if (F.fire) am.push('Radiación térmica y humo', ctx.tipo === 'incendio_tanque' && ctx.producto === 'crudo' ? 'Riesgo de boilover / slopover' : 'Reignición y propagación');
    if (ctx.tipo === 'explosion') am.push('Onda de sobrepresión, proyección de fragmentos y colapso de estructuras');
    if (F.perdida && (ctx.tipo === 'derrame_agua' || ctx.agua)) am.push(`Contaminación de ${ctx.agua || 'cuerpo de agua'} y captaciones aguas abajo`, 'Riesgo de ahogamiento en orillas');
    if (ctx.bocatoma) am.push(`Afectación de la bocatoma ${ctx.bocatomaNombre || 'aguas abajo'} y del abastecimiento de agua a la población`);
    if (F.hostil) am.push('Artefactos explosivos y presencia de actores armados o terceros hostiles');

    else if (F.social || F.hostil) ais = 'No aplica aislamiento por materiales peligrosos. Perímetro de seguridad física definido con la fuerza pública; personal y vehículos a distancia segura del punto crítico, sin confrontación.';
    else if (F.natural) ais = 'Zona de exclusión en la ladera o cauce afectado según evaluación geotécnica; no ingresar a cauces en creciente ni a zonas con grietas o agrietamiento activo.';
    else if (F.medica) ais = 'Asegurar el área del accidente; acceso solo para el personal de atención y la investigación.';
    else ais = 'Delimitar el área afectada y controlar el acceso hasta descartar pérdida de contención.';
    return { naturaleza: gram(nat + vict), amenazas: am.join('; ') + '.', aislamiento: ais };
  }

  // ---------------------------------------------------------------- objetivos, estrategias y tácticas
  /** Orden de prioridades definido por el usuario (después de la seguridad de las personas). */
  const PRIORIDADES = ['Seguridad de las personas', 'Restablecer la operación', 'Control del derrame y la fuente', 'Medio ambiente', 'Propiedad', 'Coordinación interinstitucional'];

  function propose(ctx) {
    const e = erg(ctx), F = fam(ctx);
    const lugar = ctx.infra || 'el sitio del incidente';
    const t0 = ctx.refTime || null;
    const inicial = ctx.period !== 'operacional';
    const fin = ctx.finTime || addMin(t0, inicial ? 240 : 720);
    const t1 = addMin(t0, 60), t2 = addMin(t0, inicial ? 120 : 240);
    const antes = (t, alt) => (t ? `antes de las ${t} h` : alt);
    const durante = fin ? `durante el periodo (hasta las ${fin} h)` : 'durante todo el periodo';
    const agua = F.perdida && (ctx.tipo === 'derrame_agua' || !!ctx.agua);
    const nAgua = ctx.agua || 'el cuerpo de agua afectado';
    const CM = cmgrd(ctx), BO = bomberos(ctx);
    const out = [];
    const add = (p, o) => out.push({ prioridad: PRIORIDADES[p], _p: p, ...o });

    // ---------- 0. Seguridad de las personas
    const segT = [];
    if (F.hazmat) segT.push(
      `Delimitar zona caliente (${e.inicial} m), tibia y fría con cinta y conos; ubicar el PC y el ACV en zona fría a barlovento`,
      'Medir LEL, O2, H2S, CO y VOC con detector multigas antes de cada ingreso y cada 15 min; suspender trabajos si LEL ≥ 10 %',
      'Prohibir equipos no intrínsecamente seguros, fumar y vehículos sin arrestallamas en zona caliente');
    if (F.social || F.hostil) segT.push(
      'No confrontar ni negociar en el punto de bloqueo; retirar personal y vehículos a un sitio seguro definido por Seguridad Física',
      'Mantener comunicación cada 30 min con el personal en campo y control de movimientos (quién, dónde, ruta)',
      'Suspender desplazamientos por la zona hasta autorización de la fuerza pública');
    if (F.natural) segT.push(
      'No ingresar a cauces en creciente ni a laderas con agrietamiento activo; definir puntos de observación seguros',
      'Activar o consultar el sistema de alerta temprana y los reportes del IDEAM',
      'Suspender actividades ante tormenta eléctrica y refugiarse en vehículos o instalaciones');
    if (F.medica) segT.push('Asegurar la escena antes de intervenir (energía, partes móviles, atmósfera)');
    segT.push('Charla de seguridad antes de cada ingreso; EPP completo y sistema de parejas');
    add(0, {
      key: 'seguridad',
      o: `Garantizar la seguridad del personal propio, contratista y de terceros en ${lugar} ${durante}.`,
      e: bullets([
        'Oficial de Seguridad HSE establece zonas de trabajo, control de acceso y monitoreo de condiciones',
        (F.social || F.hostil) ? 'Oficial de Seguridad Física coordina con Policía y Ejército la seguridad del área y del personal' : 'Oficial de Seguridad Física controla accesos y protege al personal en el perímetro',
        F.hazmat ? 'Monitoreo atmosférico continuo por el Grupo de Monitoreo / brigada' : '',
      ]),
      t: bullets(segT),
      recursos: F.hazmat ? 'Detectores multigas, cinta y conos, extintores PQS, EPP' : 'Radios, vehículos en buen estado, EPP, apoyo de fuerza pública',
    });
    if (ctx.victimas) add(0, {
      key: 'victimas',
      o: `Atender y trasladar a ${ctx.nVictimas ? 'las ' + ctx.nVictimas + ' víctimas' : 'las víctimas'} a centros asistenciales ${antes(t1, 'en la primera hora')}.`,
      e: bullets(['Unidad Médica / APH establece Área de Concentración de Víctimas (ACV)', 'Coordinación con el CRUE departamental para la referencia de pacientes', 'Apoyo de Cruz Roja y Defensa Civil si se supera la capacidad propia']),
      t: bullets([
        'Ubicar el ACV en zona fría, a barlovento y con acceso vehicular',
        'Clasificar con TRIAGE START y trasladar primero las víctimas en rojo',
        F.hazmat ? 'Descontaminar a las víctimas impregnadas antes del traslado' : '',
        'Registrar cada paciente en el formulario SCI 207',
      ]),
      recursos: 'Ambulancias TAB/TAM, kit de trauma, camillas',
    });
    if (ctx.comunidad || F.fire || F.gas || ctx.bocatoma) add(0, {
      key: 'comunidad',
      o: `Proteger a la comunidad del área de influencia de ${lugar}${F.fire || F.gas ? ' mediante aislamiento y evacuación preventiva' : ''} ${antes(t1, 'en la primera hora')}.`,
      e: bullets([`Oficial de Enlace coordina con Alcaldía, ${CM}, Policía y Defensa Civil`, 'Oficial de Información Pública emite mensajes a la comunidad']),
      t: bullets([
        (F.fire || F.gas) ? `Evacuar viviendas dentro de ${F.fire ? e.fuego : e.grande} m viento abajo con apoyo de Defensa Civil y conducir a un punto de encuentro seguro` : 'Informar a la comunidad sobre las zonas restringidas y las medidas de autoprotección',
        'Cierre de vías y control de tránsito con Policía en los accesos',
        F.hazmat ? 'Perifoneo con mensajes de no aproximación, no fumar y no recolectar producto' : 'Perifoneo y mensajes por emisoras locales y líderes comunitarios',
      ]),
      recursos: 'Vehículo con perifoneo, apoyo de Policía y Defensa Civil, punto de encuentro',
    });

    // ---------- 1. Restablecer la operación
    const fuenteT = F.perdida || F.gas ? 'una vez controlada la fuente, reparado el tramo y liberada el área' : '';
    if (F.social) add(1, {
      key: 'restablecer',
      o: `Restablecer el acceso y la operación normal en ${lugar} mediante el diálogo con ${ctx.tipo === 'paro_gremial' ? 'los gremios' : 'la comunidad'} ${fin ? 'antes de las ' + fin + ' h' : 'en el periodo'}.`,
      e: bullets([
        'Oficial de Enlace y el área de gestión social instalan una mesa de diálogo con Alcaldía, Personería y Defensoría del Pueblo',
        'Oficial de Seguridad Física coordina con Policía el despeje pacífico de vías y accesos',
        'Sección de Logística activa el plan de contingencia (rutas alternas, abastecimiento y relevo de personal)',
      ]),
      t: bullets([
        ctx.tipo === 'paro_gremial' ? 'Identificar los puntos de concentración del paro y las vías habilitadas con la Policía de Tránsito' : 'Identificar a los voceros y el pliego de peticiones; levantar acta de cada reunión',
        'Programar relevos de turno y abastecimiento de combustible, agua y alimentos por rutas alternas',
        'Mantener la operación de las instalaciones de forma remota o con personal mínimo esencial',
        ctx.tipo === 'invasion_dv' ? 'Documentar la ocupación (fotos, coordenadas) y solicitar a la Alcaldía la restitución del derecho de vía' : 'Registrar compromisos y hora de levantamiento del bloqueo en el SCI 214',
      ]),
      recursos: 'Vehículos para rutas alternas, reservas de combustible y víveres, equipo de gestión social',
    });
    else if (F.natural) add(1, {
      key: 'restablecer',
      o: `Restablecer la operación de forma segura en ${lugar} una vez evaluada la integridad de la tubería y superada la alerta ${fin ? 'antes de las ' + fin + ' h' : ''}.`.replace(/\s+\./, '.'),
      e: bullets(['Centro de Control (CCO) define reducción de presión o parada preventiva', 'Grupo de Integridad y Geotecnia inspecciona el tramo y autoriza la reanudación']),
      t: bullets([
        'Reducir la presión de operación o parar el bombeo según el protocolo de alerta',
        'Recorrer el tramo (a pie, dron o sobrevuelo) para verificar exposición, deformación o pérdida de contención',
        'Inspeccionar los cruces de cauce y las laderas críticas; registrar hallazgos con coordenadas',
        'Reanudar el bombeo de forma escalonada con autorización de Integridad y monitoreo de presión',
      ]),
      recursos: 'Dron, equipo de topografía, cuadrilla de mantenimiento',
    });
    else if (F.oper || F.terceros) add(1, {
      key: 'restablecer',
      o: `Restablecer la operación normal del sistema identificando y corrigiendo la causa de la ${F.oper ? 'alerta' : 'afectación'} ${antes(t2, 'en las primeras horas')}.`,
      e: bullets(['Centro de Control (CCO) analiza tendencias SCADA y balance volumétrico', 'Cuadrilla de Mantenimiento verifica el tramo en campo']),
      t: bullets([
        'Revisar presiones, caudales y alarmas del SCADA en el tramo sospechoso',
        'Recorrer el derecho de vía y descartar pérdida de contención (olor, mancha, vegetación afectada)',
        F.terceros ? 'Suspender la intervención de terceros y documentar el daño (fotos, coordenadas, responsable)' : 'Corregir la falla del equipo o del sistema de supervisión',
        'Reanudar el bombeo de forma escalonada y vigilar el comportamiento durante 2 horas',
      ]),
      recursos: 'Cuadrilla de mantenimiento, detector de gases, vehículo de recorrido',
    });
    else if (F.medica) add(1, {
      key: 'restablecer',
      o: `Restablecer las actividades en ${lugar} una vez atendido el lesionado, asegurada el área e iniciada la investigación ${antes(t2, '')}.`.replace(/\s+\./, '.'),
      e: bullets(['Oficial de Seguridad HSE verifica condiciones seguras antes de reanudar']),
      t: bullets(['Preservar la escena para la investigación', 'Reportar el accidente según el procedimiento (ARL y autoridades)', 'Reanudar con charla de seguridad sobre lo ocurrido']),
      recursos: 'Kit de investigación, formato de reporte',
    });
    else add(1, {
      key: 'restablecer',
      o: `Restablecer la operación ${F.perdida || F.gas ? 'del sistema ' + (F.fire ? fuenteT.replace('una vez ', 'una vez extinguido el incendio, ') : fuenteT) : F.fire ? 'de la instalación una vez extinguido el incendio, enfriados los equipos y evaluada su integridad' : 'del sistema'} ${fin ? 'con meta antes de las ' + fin + ' h' : ''}.`.replace(/\s+\./, '.').replace(/\s{2,}/g, ' '),
      e: bullets(['Centro de Control (CCO) y Mantenimiento planifican la reparación y el arranque', 'Oficial de Seguridad HSE verifica condiciones y permisos de trabajo']),
      t: bullets([
        F.fire ? 'Inspeccionar daños estructurales y eléctricos antes de energizar' : 'Ejecutar la reparación definitiva (camisa, grapa definitiva o cambio de tramo)',
        'Realizar la prueba de integridad y verificar ausencia de fugas',
        'Arrancar el bombeo de forma escalonada con monitoreo de presión',
        'Recorrer el derecho de vía después del arranque y registrar la hora de restablecimiento en el SCI 214',
      ]),
      recursos: 'Cuadrilla de mantenimiento, materiales de reparación, permisos de trabajo',
    });

    // ---------- 2. Control del derrame y la fuente
    if ((F.perdida || F.gas) && !ctx.fuenteControlada && ctx.tipo !== 'incendio_estacion') {
      const ilicito = ctx.tipo === 'valvula_ilicita' || ctx.tipo === 'atentado';
      add(2, {
        key: 'fuente',
        o: `Controlar la fuente de la fuga en ${lugar} ${antes(t2, 'en las dos primeras horas')}.`,
        e: bullets([
          'Centro de Control (CCO) realiza parada de bombeo y aislamiento del tramo',
          'Grupo de Mantenimiento interviene el punto de fuga',
          ilicito ? 'Oficial de Seguridad Física gestiona la verificación antiexplosivos de la fuerza pública antes de intervenir' : '',
        ]),
        t: bullets([
          'Confirmar parada de bombeo y cierre de válvulas de seccionamiento aguas arriba y aguas abajo',
          'Despresurizar el tramo y verificar atmósfera antes de intervenir',
          ilicito ? 'Esperar la liberación del área por la fuerza pública; retirar la válvula ilícita e instalar grapa o abrazadera' : 'Instalar grapa / abrazadera o tapón en el punto de fuga',
          'Registrar la hora de control de la fuente en el SCI 214',
        ]),
        recursos: 'Grapas/abrazaderas, herramienta antichispa, cuadrilla de mantenimiento',
      });
    }
    if (F.fire) add(2, {
      key: 'fuego',
      o: `Controlar el incendio y proteger las exposiciones en ${lugar} ${antes(t2, 'en las dos primeras horas')}.`,
      e: bullets([
        `Comando Unificado con el ${BO}: el comandante de bomberos se integra al PC`,
        'Grupo de Control de Incendios (brigada propia y bomberos) con espuma y enfriamiento',
        `Defensa Civil apoya aislamiento, evacuación y abastecimiento de agua; el ${CM} activa la Estrategia Municipal de Respuesta`,
      ]),
      t: bullets([
        ctx.tipo === 'incendio_forestal' ? 'Construir líneas de control (cortafuegos) entre el fuego y el derecho de vía; ataque indirecto con bomberos forestales' : 'Aplicar espuma AFFF/AR-AFFF (3 %–6 %) con monitores desde barlovento, según la tasa de aplicación de NFPA 11',
        'Enfriar con chorro de agua los tanques, líneas y equipos expuestos; no aplicar agua directa sobre el hidrocarburo en llamas',
        ctx.tipo === 'incendio_tanque' && ctx.producto === 'crudo' ? 'Vigilar signos de boilover; retirar al personal del perímetro ante cualquier señal' : 'Asegurar el suministro continuo de agua y concentrado (carrotanques de bomberos y Defensa Civil)',
        'Contener la escorrentía de agua y espuma con diques',
      ]),
      recursos: 'Máquinas de bomberos, monitores, concentrado de espuma, carrotanques de agua',
    });
    if (F.gas && !F.fire) add(2, {
      key: 'gas',
      o: `Controlar la atmósfera inflamable alrededor de ${lugar} ${antes(t1, 'en la primera hora')}.`,
      e: bullets(['Dispersión de vapores por Grupo de Control con apoyo del ' + BO, 'Eliminación de fuentes de ignición']),
      t: bullets([
        'Instalar cortinas de agua viento abajo de la fuga',
        'Monitorear LEL en el perímetro y en espacios bajos cada 10 min',
        'No ingresar a zonas con LEL ≥ 10 %; cortar energía eléctrica del área desde fuera de la zona',
      ]),
      recursos: 'Monitores con boquilla de neblina, detectores LEL',
    });
    if (F.perdida && !agua) add(2, {
      key: 'contencion',
      o: `Contener el hidrocarburo derramado dentro del área afectada en ${lugar} ${antes(t2, 'en las dos primeras horas')}.`,
      e: bullets(['Grupo de Contención con diques y zanjas en suelo', 'Protección de drenajes y alcantarillas']),
      t: bullets([
        'Construir diques en tierra o con sacos y zanjas de intercepción en el frente de avance',
        'Sellar drenajes, cajas y alcantarillas con tapones o barreras',
        ctx.lluvia ? 'Cubrir el área impregnada con polietileno para evitar el arrastre por lluvia' : 'Aplicar material absorbente en el frente del derrame',
      ]),
      recursos: 'Palas, sacos de arena, material absorbente, polietileno',
    });
    if (agua) add(2, {
      key: 'agua',
      o: `Contener y confinar el hidrocarburo en ${nAgua} aguas abajo del punto de ingreso ${antes(t2, 'en las dos primeras horas')}.`,
      e: bullets(['Grupo de Contención instala barreras en puntos de control', 'Alerta temprana a captaciones y acueductos aguas abajo']),
      t: bullets([
        'Instalar barreras de contención en ángulo en los puntos de control predefinidos (p. ej. 100 m, 500 m y 1 km aguas abajo)',
        'Construir presas de subflujo en caños y quebradas de bajo caudal',
        'Instalar barreras absorbentes como segunda línea',
      ]),
      recursos: 'Barreras de contención y absorbentes, embarcación, anclajes',
    });
    if (F.perdida && (!inicial || ctx.volumen)) add(2, {
      key: 'recuperacion',
      o: `Recuperar el hidrocarburo contenido en ${agua ? nAgua : lugar} ${fin ? 'antes de las ' + fin + ' h' : 'durante el periodo'}.`,
      e: bullets(['Grupo de Recuperación con medios mecánicos', 'Almacenamiento temporal seguro del producto recuperado']),
      t: bullets([
        'Ubicar desnatadores (skimmers) en los ápices de las barreras y succionar con vactor',
        'Instalar tanques portátiles sobre geomembrana con dique',
        'Registrar los volúmenes recuperados por turno',
      ]),
      recursos: 'Skimmers, vactor/carrotanque, bombas neumáticas, tanques portátiles',
    });

    // ---------- 3. Medio ambiente
    if (ctx.bocatoma) add(3, {
      key: 'bocatoma',
      o: `Proteger ${/^bocatoma/i.test(ctx.bocatomaNombre || '') ? 'la ' + ctx.bocatomaNombre.replace(/^Bocatoma/, 'bocatoma') : 'la bocatoma ' + (ctx.bocatomaNombre || 'afectada')} y garantizar el abastecimiento de agua a la población ${antes(t1, 'en la primera hora')}.`,
      e: bullets([
        `Oficial de Enlace notifica a la empresa de acueducto, al ${CM} y a la Secretaría de Salud para el cierre preventivo de la captación`,
        'Defensa Civil y Bomberos apoyan el suministro alterno de agua potable con carrotanques',
        'Grupo de Contención protege la captación con barreras aguas arriba',
      ]),
      t: bullets([
        'Confirmar el cierre de la bocatoma con el operador del acueducto y registrar la hora',
        'Instalar barreras de contención y absorbentes aguas arriba de la captación',
        'Monitorear la calidad del agua con la autoridad ambiental y la Secretaría de Salud antes de autorizar la reapertura',
        'Definir con el CMGRD los puntos de entrega de agua y comunicarlos a la comunidad',
      ]),
      recursos: 'Barreras, carrotanques de agua potable, equipo de muestreo',
    });
    if (F.perdida && (!inicial || agua)) add(3, {
      key: 'ambiente',
      o: `Proteger las áreas ambientalmente sensibles y la fauna en el área de influencia ${durante}.`,
      e: bullets(['Grupo Ambiental identifica y protege áreas sensibles', 'Monitoreo de calidad de agua y suelo con la autoridad ambiental (CAR / ANLA)']),
      t: bullets([
        'Priorizar la protección de humedales, nacimientos y zonas de alta sensibilidad',
        'Tomar muestras de agua y suelo aguas arriba y aguas abajo',
        'Rescatar y atender fauna impregnada con personal especializado',
      ]),
      recursos: 'Equipo de muestreo, kit de rescate de fauna',
    });
    if (F.natural || F.oper || F.terceros) add(3, {
      key: 'prevencion_amb',
      o: `Prevenir la afectación ambiental por una eventual pérdida de contención en ${lugar} ${durante}.`,
      e: bullets(['Grupo de Contención preposiciona recursos en los puntos de control aguas abajo']),
      t: bullets(['Ubicar barreras y material absorbente en los puntos de control más cercanos', 'Verificar el estado de los cruces de cauce en cada recorrido']),
      recursos: 'Barreras, absorbentes, vehículo de respuesta',
    });
    if (!inicial && F.perdida) add(3, {
      key: 'residuos',
      o: `Gestionar los residuos generados en la atención de la emergencia ${durante}.`,
      e: bullets(['Unidad de Residuos con acopio temporal y gestor autorizado']),
      t: bullets([
        'Instalar centro de acopio temporal sobre geomembrana con dique',
        'Separar residuos por tipo (sólidos impregnados, líquidos, EPP)',
        'Registrar cantidades y entregar con manifiesto a gestor autorizado',
      ]),
      recursos: 'Geomembrana, bolsas y canecas rotuladas, gestor autorizado',
    });

    // ---------- 4. Propiedad
    if (F.social || F.hostil) add(4, {
      key: 'propiedad',
      o: `Proteger las instalaciones, equipos y vehículos en ${lugar} ${durante}.`,
      e: bullets(['Oficial de Seguridad Física con apoyo de Policía y Ejército', 'Sección de Logística asegura los activos móviles']),
      t: bullets([
        'Cerrar y asegurar instalaciones; reforzar la vigilancia en válvulas y estaciones críticas',
        'Retirar vehículos y equipos de las zonas de conflicto',
        'Registrar con fotos y coordenadas cualquier daño para el trámite de reclamaciones',
      ]),
      recursos: 'Vigilancia, candados y sellos, apoyo de fuerza pública',
    });
    else if (F.natural) add(4, {
      key: 'propiedad',
      o: `Proteger la tubería y los equipos expuestos en ${lugar} ${durante}.`,
      e: bullets(['Grupo de Mantenimiento ejecuta obras de emergencia', 'Sección de Logística retira equipos de zonas inundables']),
      t: bullets([
        'Ejecutar obras de emergencia (trinchos, desvío de aguas, protección del cruce)',
        'Retirar equipos, vehículos y materiales de las zonas de amenaza',
        'Registrar daños a la infraestructura y predios de terceros para reclamaciones',
      ]),
      recursos: 'Maquinaria, sacos, geotextil, cuadrilla de obras',
    });
    else if (F.hazmat) add(4, {
      key: 'propiedad',
      o: `Proteger la infraestructura y los bienes expuestos (tubería, válvulas, equipos y predios de terceros) en ${lugar} ${durante}.`,
      e: bullets(['Grupo de Mantenimiento protege y aísla equipos', 'Oficial de Seguridad Física previene hurto y vandalismo', 'Sección de Admón. y Finanzas registra afectaciones a terceros']),
      t: bullets([
        F.fire ? 'Enfriar estructuras expuestas y aislar la energía eléctrica' : 'Aislar la energía eléctrica de equipos en la zona afectada',
        'Vigilar el sitio para evitar hurto de producto o equipos',
        'Inventariar predios, cultivos y bienes de terceros afectados (fotos y coordenadas)',
      ]),
      recursos: 'Vigilancia, cámara, formatos de registro de afectaciones',
    });

    // ---------- 5. Coordinación interinstitucional
    const ent = [CM, 'Alcaldía'];
    if (F.fire || F.gas) ent.push('Cuerpo de Bomberos', 'Defensa Civil');
    if (ctx.victimas) ent.push('CRUE / Secretaría de Salud', 'Cruz Roja');
    if (ctx.bocatoma) ent.push('empresa de acueducto');
    if (F.perdida) ent.push('autoridad ambiental (CAR / ANLA)');
    if (F.social || F.hostil) ent.push('Policía', 'Ejército', 'Personería');
    if (F.natural) ent.push('Defensa Civil', 'IDEAM / UNGRD');
    add(5, {
      key: 'coordinacion',
      o: `Informar y coordinar con ${[...new Set(ent)].join(', ')} ${antes(t1, 'en la primera hora')}.`,
      e: bullets(['Oficial de Enlace notifica y mantiene contacto con las entidades', 'Oficial de Información Pública centraliza los comunicados']),
      t: bullets([
        'Enviar el reporte inicial con el SCI 201',
        (F.fire || ctx.bocatoma || F.natural) ? `Solicitar la activación de la Estrategia Municipal de Respuesta al ${CM}` : '',
        'Programar reuniones de actualización al cierre de cada periodo operacional',
      ]),
      recursos: 'Comunicaciones, directorio de emergencias, SCI 201 actualizado',
    });

    return out.sort((a, b) => a._p - b._p).map(({ _p, ...x }) => ({ ...x, o: gram(x.o), e: gram(x.e), t: gram(x.t) }));
  }

  function mensajeSeguridad(ctx) {
    const e = erg(ctx), F = fam(ctx);
    const partes = ['Toda persona que ingrese a la escena se registra en el PC y recibe charla de seguridad.'];
    if (F.hazmat) partes.push(
      `Respetar las zonas: caliente ${e.inicial} m, solo personal autorizado con EPP completo y monitoreo de gases.`,
      'Suspender trabajos si LEL ≥ 10 %, si hay H2S o si cambia la dirección del viento hacia el personal.',
      'Prohibido fumar, usar celulares o equipos no intrínsecamente seguros en zona caliente.');
    if (F.fire) partes.push('Atacar el fuego siempre desde barlovento, con rutas de escape definidas y bajo el mando del Comando Unificado con bomberos.');
    if (F.perdida && (ctx.tipo === 'derrame_agua' || ctx.agua)) partes.push('Trabajos en orillas y embarcaciones con chaleco salvavidas y línea de vida.');
    if (F.hostil) partes.push('No intervenir hasta la verificación de la fuerza pública; reportar objetos sospechosos y no manipularlos.');
    if (F.social) partes.push('No confrontar ni discutir con manifestantes; seguir las instrucciones del Oficial de Seguridad Física y reportar cada desplazamiento.');
    if (F.natural) partes.push('No ingresar a cauces en creciente ni a laderas inestables; atender las alertas del IDEAM y del CMGRD.');
    if (ctx.lluvia || ctx.tipo === 'tormenta') partes.push('Ante tormenta eléctrica, suspender actividades y refugiarse.');
    partes.push('Hidratación y pausas cada 2 horas; reportar cualquier incidente al Oficial de Seguridad HSE.');
    return partes.join(' ');
  }

  // ---------------------------------------------------------------- revisión de calidad de un objetivo
  function revisarObjetivo(txt) {
    const t = (txt || '').trim();
    const issues = [];
    if (!t) return issues;
    const first = t.split(/\s+/)[0].toLowerCase().replace(/[^a-záéíóúñ]/g, '');
    if (!/(ar|er|ir)$/.test(first)) issues.push('Inicie con un verbo en infinitivo (Controlar, Contener, Restablecer…).');
    if (!/(antes de|hasta|durante|horas?|\d{1,2}:\d{2}|periodo|minutos|una vez)/i.test(t)) issues.push('Agregue un límite de tiempo para que sea medible.');
    if (t.length < 25) issues.push('Es muy corto: indique qué, dónde y en cuánto tiempo.');
    if (t.length > 240) issues.push('Es muy largo: un objetivo debe ser corto y claro.');
    return issues;
  }

  // ---------------------------------------------------------------- IA generativa (opcional)
  function buildPrompt(ctx, form, extra) {
    const F = fam(ctx);
    const datos = {
      tipo_evento: TIPOS[ctx.tipo] || ctx.tipo,
      producto: PRODUCTOS[ctx.producto] || ctx.producto,
      hay_perdida_de_contencion: F.perdida || F.gas ? 'sí' : 'no',
      volumen_estimado: ctx.volumen || 'no reportado',
      cuerpo_de_agua: ctx.agua || 'ninguno',
      bocatomas_afectadas: ctx.bocatoma ? (ctx.bocatomaNombre && !ctx.anonimo ? ctx.bocatomaNombre : 'sí') : 'no',
      hay_incendio: F.fire ? 'sí' : 'no',
      victimas: ctx.victimas ? (ctx.nVictimas || 'sí') : 'no',
      comunidad_cercana: ctx.comunidad ? 'sí' : 'no',
      fuente_controlada: ctx.fuenteControlada ? 'sí' : 'no',
      lluvia: ctx.lluvia ? 'sí' : 'no', noche: ctx.noche ? 'sí' : 'no',
      hora_referencia: ctx.refTime || 'no indicada', fin_periodo: ctx.finTime || 'no indicado',
      periodo: ctx.period === 'operacional' ? 'Periodo operacional (5 a 12 horas)' : 'Periodo inicial (0 a 4 horas)',
      lugar: ctx.anonimo ? 'el sitio del incidente' : (ctx.infra || 'el sitio del incidente'),
      municipio: ctx.anonimo ? 'no indicado' : (ctx.municipio || 'no indicado'),
      recursos_en_escena: extra?.recursos || 'no indicados',
      notas_del_comandante: extra?.notas || '',
    };
    return `Eres un experto en el Sistema Comando de Incidentes (SCI) aplicado a emergencias de transporte de hidrocarburos en Colombia (oleoductos, poliductos, estaciones), incluidos eventos sociales, climáticos, operacionales y de fuerzas externas.
Propón objetivos, estrategias y tácticas para el formulario ${form === '202' ? 'SCI 202 Plan de Acción del Incidente' : 'SCI 201 Resumen del Incidente (respuesta inicial)'}.
Reglas:
- Incluye siempre primero un objetivo de seguridad de las personas. Después ordena por estas prioridades: 1) Restablecer la operación, 2) Control del derrame y la fuente, 3) Medio ambiente, 4) Propiedad. Agrega coordinación interinstitucional al final.
- Omite las prioridades que no apliquen al evento (por ejemplo, sin pérdida de contención no hay control del derrame).
- Si hay incendio, integra en estrategias y tácticas al Cuerpo de Bomberos (Comando Unificado), la Defensa Civil y el CMGRD del municipio.
- Si hay bocatomas afectadas, integra a la empresa de acueducto, el CMGRD, la Secretaría de Salud, la Defensa Civil y los Bomberos (cierre de captación y suministro alterno de agua).
- En eventos sociales (bloqueos, paros) usa al Oficial de Enlace, gestión social, Alcaldía, Personería, Defensoría y al Oficial de Seguridad Física con la fuerza pública; nunca la confrontación.
- Distingue el Oficial de Seguridad HSE (seguridad industrial y salud) del Oficial de Seguridad Física (seguridad patrimonial y fuerza pública).
- Cada objetivo: corto, inicia con verbo en infinitivo, medible y con tiempo (usa la hora de referencia y el fin del periodo).
- Estrategia: el medio y quién lo hace (posición SCI, grupo o entidad).
- Táctica: dónde, cuándo y cómo, concreta y ejecutable con los recursos en escena.
- Entre 3 y ${form === '202' ? '8' : '6'} objetivos.
Datos del incidente (JSON): ${JSON.stringify(datos)}
Responde SOLO con JSON válido con esta forma:
{"objetivos":[{"prioridad":"${PRIORIDADES.join('|')}","objetivo":"...","estrategias":["..."],"tacticas":["..."],"recursos":"..."}],"mensaje_seguridad":"...","consejos":["..."]}`;
  }

  function toResult(data) {
    const list = (data?.objetivos || []).map((x, i) => ({
      key: 'ia' + i, prioridad: x.prioridad || '',
      o: x.objetivo || '', e: bullets(x.estrategias || []), t: bullets(x.tacticas || []), recursos: x.recursos || '',
    }));
    return { list, seguridad: data?.mensaje_seguridad || '', consejos: data?.consejos || [] };
  }

  /** Error con explicación clara para el usuario. */
  function aiError(msg, detalle) { const e = new Error(msg); e.detalle = detalle || ''; return e; }

  async function geminiOnce(key, mdl, prompt) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(mdl)}:generateContent?key=${encodeURIComponent(key)}`;
    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { temperature: 0.4, responseMimeType: 'application/json' } }),
      });
    } catch (e) {
      const offline = typeof navigator !== 'undefined' && navigator.onLine === false;
      throw aiError(offline
        ? 'El dispositivo está sin conexión a internet.'
        : 'El navegador no pudo contactar el servidor de Google. Abra la app desde su dirección web publicada (https://…github.io/…), no como archivo descargado, y verifique que la red no bloquee googleapis.com.', String(e && e.message || e));
    }
    const j = await res.json().catch(() => ({}));
    if (!res.ok) {
      const m = j?.error?.message || '';
      const st = j?.error?.status || '';
      if (res.status === 404) throw Object.assign(aiError(`El modelo "${mdl}" no está disponible para su clave.`, m), { code: 404 });
      if (res.status === 400 && /api key|API_KEY/i.test(m)) throw aiError('La clave de API no es válida. Cópiela de nuevo desde aistudio.google.com/apikey, sin espacios.', m);
      if (res.status === 403) throw aiError('La clave no tiene permiso para la API de Gemini. En AI Studio cree la clave en un proyecto con la API "Generative Language" habilitada.', m);
      if (res.status === 429) throw Object.assign(aiError('Se alcanzó el límite gratuito de uso de todos los modelos disponibles. Espere uno o dos minutos e intente de nuevo.', m), { code: 429 });
      if (res.status === 503 || res.status === 500 || res.status === 502 || res.status === 504) throw Object.assign(aiError('Los servidores gratuitos de Google están saturados en este momento. Intente de nuevo en unos minutos.', m), { code: 503 });
      if (/location|region|country/i.test(m)) throw aiError('El servicio gratuito de Gemini no está disponible en esta región o cuenta.', m);
      throw aiError(`Google respondió con error ${res.status} ${st}.`, m);
    }
    const txt = j?.candidates?.[0]?.content?.parts?.map((p) => p.text).join('') || '';
    try { return JSON.parse(txt.replace(/^```json|```$/g, '').trim()); }
    catch { throw aiError('La IA no devolvió un formato válido. Intente de nuevo.', txt.slice(0, 200)); }
  }

  async function gemini({ key, model, ctx, form, extra }) {
    key = String(key || '').replace(/\s+/g, '');
    if (!key) throw aiError('Falta la clave de API de Gemini. Péguela en Ajustes.');
    const prompt = buildPrompt(ctx, form, extra);
    const first = (model || 'gemini-flash-latest').trim();
    // Si un modelo está saturado (503), sin cupo (429) o no existe (404), se prueba el siguiente.
    const tries = [first, ...['gemini-flash-latest', 'gemini-2.5-flash', 'gemini-flash-lite-latest', 'gemini-2.5-flash-lite', 'gemini-2.0-flash'].filter((m) => m !== first)];
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    let lastErr, best;
    for (let i = 0; i < tries.length; i++) {
      const mdl = tries[i];
      for (let attempt = 0; attempt < (i === 0 ? 2 : 1); attempt++) {
        try { const data = await geminiOnce(key, mdl, prompt); return { ...toResult(data), model: mdl }; }
        catch (e) {
          lastErr = e;
          if (![404, 429, 503].includes(e.code)) throw e;
          if (e.code !== 404) best = e;
          if (e.code === 503 && attempt === 0 && i === 0) { await wait(1500); continue; }
          break;
        }
      }
    }
    throw best || lastErr;
  }

  /** IA generativa dentro de Claude (vista previa del artifact): no requiere clave. */
  async function claudeAI({ sample, ctx, form, extra }) {
    try {
      const data = await sample.json(buildPrompt(ctx, form, extra), { modelTier: 'default' });
      return { ...toResult(data), model: 'Claude' };
    } catch (e) {
      if (e?.code === 'not_granted') throw aiError('No se dio permiso para consultar a Claude desde esta página.');
      if (e?.code === 'rate_limited') throw aiError('Demasiadas consultas seguidas. Espere un momento.');
      throw aiError('No se pudo consultar a Claude: ' + (e?.message || e));
    }
  }

  return { TIPOS, TIPO_GRUPOS, PRODUCTOS, PRIORIDADES, fam, spillDefault, propose, evaluacion, mensajeSeguridad, revisarObjetivo, gemini, claudeAI, erg, addMin };
})();
if (typeof module !== 'undefined') module.exports = SCIAI;

</script>

function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('No se pudo guardar en este dispositivo: ' + e.message); } }, 250); }

const getP = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
function setP(o, p, v) { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach((k, i) => { if (a[k] == null) a[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[k]; }); a[ks[ks.length - 1]] = v; }

function dtAdd(date, time, min) {
  if (!date || !time) return '';
  const d = new Date(`${date}T${time}:00`); d.setMinutes(d.getMinutes() + min);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function setPeriodTimes(I) {
  const c = I.common;
  if (I.period === 'inicial') { c.poNo = c.poNo || '1'; c.poIni = dtAdd(c.fechaInc, c.horaInc, 0); c.poFin = dtAdd(c.fechaInc, c.horaInc, 240); }
  else { c.poNo = (!c.poNo || c.poNo === '1') ? '2' : c.poNo; c.poIni = dtAdd(c.fechaInc, c.horaInc, 240); c.poFin = dtAdd(c.fechaInc, c.horaInc, 720); }
}
function newIncident(period) {
  const id = Date.now().toString(36);
  const st = S.settings;
  S.incidents[id] = {
    id, created: new Date().toISOString(), period, forms: {}, status: {},
    common: { tipo: 'derrame_tierra', producto: 'crudo', fechaInc: today(), horaInc: nowHM(), prepNombre: st.prepNombre || '', prepPos: st.prepPos || 'Comandante de Incidente',
      ciNombre: st.prepNombre || '', org: { ci: st.prepNombre || '' }, sit: {} },
  };
  S.current = id; setPeriodTimes(S.incidents[id]); save();
  return S.incidents[id];
}
function newForm(code) {
  const f = { fechaPrep: today(), horaPrep: nowHM() };
  if (code === '201') f.oet = [{}, {}, {}];
  if (code === '202') f.oet = [{}, {}, {}];
  if (code === '207') f.victimas = [{}];
  if (code === '211') { f.rec = [{}]; f.lugar = 'PC'; }
  if (code === '214') { f.personal = [{}]; f.act = [{}]; }
  if (code === '204') f.rec = [{}];
  if (code === '205') f.sis = [{}];
  if (code === '206') { f.puestos = [{}]; f.transp = [{}]; f.hosp = [{}]; }
  if (code === '201') f.acciones = [{}];
  return f;
}
function forms(code) { const I = inc(); if (!I.forms[code]) I.forms[code] = [newForm(code)]; return I.forms[code]; }

  const I = inc();

}

function elapsed() {
  const c = inc()?.common; if (!c?.fechaInc || !c?.horaInc) return null;
  const ms = Date.now() - new Date(`${c.fechaInc}T${c.horaInc}:00`).getTime();
  return ms / 60000;
}
function renderTop() {

  tc.innerHTML = `<div class="h">${h}</div><div class="p">${esc(PERIODS[I.period].label)}</div>`;
}

function fieldHTML(fd, scope, base, val, extraCls = '') {
  const p = base ? base + '.' + fd.k : fd.k;
  const id = 'fld-' + scope + '-' + p.replace(/\./g, '-');
  const v = val ?? '';
  const ds = `data-s="${scope}" data-p="${esc(p)}" id="${id}"`;
  let ph = fd.ph || '';
  if (fd.from && !v) { const fv = getP(inc().common, fd.from); if (fv) ph = fv + ' (de la organización)'; }
  if (fd.fromC && !v) { const fv = inc().common[fd.fromC]; if (fv) ph = fv + ' (de los datos del incidente)'; }
  const cls = `f ${fd.full || fd.t === 'area' ? 'full' : ''} ${extraCls}`;
  const lab = fd.l ? `<label for="${id}">${esc(fd.l)}</label>` : '';
  let input = '';
  switch (fd.t) {
    case 'area': input = `<textarea ${ds} placeholder="${esc(ph)}">${esc(v)}</textarea>`; break;
    case 'date': input = `<input type="date" ${ds} value="${esc(v)}">`; break;
    case 'time': input = `<input type="time" ${ds} value="${esc(v)}">`; break;
    case 'datetime': input = `<input type="datetime-local" ${ds} value="${esc(v)}">`; break;
    case 'select': {
      const o1 = (o) => `<option value="${esc(o.v)}" ${o.v === v ? 'selected' : ''}>${esc(o.l)}</option>`;
      const inner = fd.groups ? fd.groups.map((g) => `<optgroup label="${esc(g.g)}">${Object.entries(g.items).map(([k, l]) => o1({ v: k, l })).join('')}</optgroup>`).join('') : fd.opts.map(o1).join('');
      input = `<select ${ds}><option value="">Seleccione…</option>${inner}</select>`; break; }
    case 'seg': return `<div class="${cls}"><span class="lbl">${esc(fd.l)}</span><div class="seg" role="radiogroup">${fd.opts.map((o) =>
      `<label><input type="radio" name="${id}" data-s="${scope}" data-p="${esc(p)}" value="${esc(o.v)}" ${o.v === v ? 'checked' : ''}>${esc(o.l)}</label>`).join('')}</div></div>`;
    default: input = `<input type="text" ${fd.num ? 'inputmode="numeric"' : ''} ${fd.list ? `list="${fd.list}"` : ''} ${ds} value="${esc(v)}" placeholder="${esc(ph)}" autocomplete="off">`;
  }
  const qa = fd.qa ? `<p class="qa" data-qa="${id}">${esc(SCIAI.revisarObjetivo(v).join(' '))}</p>` : '';
  return `<div class="${cls}">${lab}${input}${qa}</div>`;
}

function orgSVG(c, print) {
  const m = SCIMaps.orgModel(c);
  const C = 48, R = 24;
  const L = SCIMaps.layoutOrg(m, C, R);
  const sx = 20, sy = 19;
  const maxY = Math.max(...L.boxes.map((b) => b.y2)) + 0.4;
  const W = C * sx, H = Math.ceil(maxY * sy);
  const col = print ? { line: '#3E4B5E', ink: '#1B2430', ci: '#D6DEE8', sec: '#E8EDF2', unit: '#FFFFFF', muted: '#55606C' }
    : { line: 'var(--band)', ink: 'var(--ink)', ci: 'var(--accent-soft)', sec: 'var(--surface-2)', unit: 'var(--surface)', muted: 'var(--muted)' };
  const fit = (t, px, fs) => { const n = Math.max(4, Math.floor(px / (fs * 0.55))); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
  const lines = L.lines.map((l) => `<line x1="${l.x1 * sx}" y1="${l.y1 * sy}" x2="${l.x2 * sx}" y2="${l.y2 * sy}" style="stroke:${col.line};stroke-width:1.6"/>`).join('');
  const boxes = L.boxes.map((b) => {
    const x = b.x1 * sx, y = b.y1 * sy, w = (b.x2 - b.x1) * sx, h = (b.y2 - b.y1) * sy;
    const fs = b.kind === 'unit' ? 10 : 11;
    const two = !!b.name;
    const ty = y + h / 2 + (two ? -2 : 4);
    return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" style="fill:${col[b.kind === 'staff' ? 'unit' : b.kind]};stroke:${col.line};stroke-width:1.3${b.dashed ? ';stroke-dasharray:5 3' : ''}"/>
      <text x="${x + w / 2}" y="${ty}" text-anchor="middle" style="fill:${col.ink};font:600 ${fs}px Barlow,Arial,sans-serif">${esc(fit(b.title, w - 6, fs))}</text>
      ${two ? `<text x="${x + w / 2}" y="${ty + fs + 1}" text-anchor="middle" style="fill:${col.muted};font:400 ${fs - 0.5}px Barlow,Arial,sans-serif">${esc(fit(b.name, w - 6, fs))}</text>` : ''}</g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Organigrama del incidente" style="display:block;max-width:100%;height:auto">${lines}${boxes}</svg>`;
}

// ------------------------------------------------------------------ coordenadas geográficas (grados, minutos, segundos · WGS84)
const pad2 = (n) => String(n ?? 0).padStart(2, '0');
function setGeoFromDecimal(c, lat, lon) {
  const t = (dec, isLat) => {
    const h = dec < 0 ? (isLat ? 'S' : 'W') : (isLat ? 'N' : 'E');
    const a = Math.abs(dec); let d = Math.floor(a); const mf = (a - d) * 60; let m = Math.floor(mf);
    let s = Math.round((mf - m) * 6000) / 100; if (s >= 60) { s = 0; m++; } if (m >= 60) { m = 0; d++; }
    return { d: String(d), m: String(m), s: s.toFixed(2), h };
  };
  const A = t(lat, true), B = t(lon, false);
  c.geo = { latD: A.d, latM: A.m, latS: A.s, latH: A.h, lonD: B.d, lonM: B.m, lonS: B.s, lonH: B.h };
  syncGeo(c);
}
function geoDecimal(c) {
  const g = c.geo; if (!g) return null;
  const num = (x) => { const v = parseFloat(String(x ?? '').replace(',', '.')); return isNaN(v) ? 0 : v; };
  if (String(g.latD ?? '').trim() === '' || String(g.lonD ?? '').trim() === '') return null;
  if ([g.latM, g.latS, g.lonM, g.lonS].some((x) => num(x) < 0 || num(x) >= 60)) return null;
  let lat = Math.abs(num(g.latD)) + num(g.latM) / 60 + num(g.latS) / 3600; if (g.latH === 'S') lat = -lat;
  let lon = Math.abs(num(g.lonD)) + num(g.lonM) / 60 + num(g.lonS) / 3600; if (g.lonH === 'W') lon = -lon;
  if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return { lat, lon };
}
function geoText(c) {
  const g = c.geo; if (!geoDecimal(c)) return '';
  const sec = (x) => (parseFloat(String(x || '0').replace(',', '.')) || 0).toFixed(1).padStart(4, '0');
  return `${parseInt(g.latD, 10)}°${pad2(parseInt(g.latM || 0, 10))}'${sec(g.latS)}" ${g.latH} ${parseInt(g.lonD, 10)}°${pad2(parseInt(g.lonM || 0, 10))}'${sec(g.lonS)}" ${g.lonH}`;
}
function syncGeo(c) { c.coords = geoText(c); }
function geoPrev(c) {
  const p = geoDecimal(c);
  return p ? `En el formato: ${geoText(c)} (WGS84) · decimal ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}` : 'Complete grados, minutos y segundos de latitud y longitud.';
}
function geoHTML(c) {
  if (!c.geo) { const p = parseCoords(c.coords); if (p) setGeoFromDecimal(c, p.lat, p.lon); else c.geo = { latH: 'N', lonH: 'W' }; }
  const g = c.geo;
  const inp = (k, ph, cls = '') => `<input type="text" inputmode="decimal" id="fld-c-geo-${k}" data-s="c" data-p="geo.${k}" value="${esc(g[k] ?? '')}" placeholder="${ph}" aria-label="${ph}" class="${cls}" autocomplete="off">`;
  const hs = (k, a, b) => `<select id="fld-c-geo-${k}" data-s="c" data-p="geo.${k}" aria-label="Hemisferio">${[a, b].map((x) => `<option ${g[k] === x ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
  return `<div class="f full"><span class="lbl">Coordenadas geográficas (grados, minutos y segundos · WGS84)</span>
    <div class="geo-wrap"><span class="geo-l">Latitud</span><div class="geo">${inp('latD', 'grados')}<span class="u">°</span>${inp('latM', 'min')}<span class="u">'</span>${inp('latS', 'seg', 'sec')}<span class="u">"</span>${hs('latH', 'N', 'S')}</div></div>
    <div class="geo-wrap"><span class="geo-l">Longitud</span><div class="geo">${inp('lonD', 'grados')}<span class="u">°</span>${inp('lonM', 'min')}<span class="u">'</span>${inp('lonS', 'seg', 'sec')}<span class="u">"</span>${hs('lonH', 'W', 'E')}</div></div>
    <p class="note mono" id="geo-prev">${esc(geoPrev(c))}</p>
    <div class="row"><button class="btn small" data-act="gps" type="button">Tomar del GPS</button>
      <details><summary class="note">¿Tiene coordenadas decimales?</summary><div class="row" style="margin-top:6px"><input type="text" id="geo-dec" placeholder="8.60120, -73.61230" aria-label="Coordenadas decimales" style="min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)"><button class="btn small" data-act="geo-conv" type="button">Convertir</button></div></details></div></div>`;
}

// ------------------------------------------------------------------ dictado por voz (seguro y verificable)
const MIC_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
const Dict = { st: null };
const DICT_LANGS = ['es-CO', 'es-419', 'es-US', 'es-ES', 'es'];
const DICT_ERR = {
  'not-allowed': 'Permiso de micrófono denegado. Actívelo para este sitio en la configuración del navegador.',
  'service-not-allowed': 'El navegador no permite el dictado en este sitio. Revise los permisos de micrófono.',
  'no-speech': 'No se detectó voz. Toque "Dictar" y hable cerca del micrófono.',
  'audio-capture': 'No se encontró un micrófono disponible.',
  'network': 'El dictado necesita conexión a internet en este dispositivo. Intente de nuevo con señal o use el teclado.',
  'language-not-supported': 'El español no está disponible para dictado en este dispositivo.',
};
async function dictCheck() {
  if (typeof SRClass.available === 'function') {
    for (const lang of DICT_LANGS) {
      let r = null; try { r = await SRClass.available({ langs: [lang], processLocally: true }); } catch (e) { r = null; }
      if (r === 'available') return { mode: 'local', lang };
      if (r === 'downloadable' || r === 'downloading') return { mode: 'download', lang };
    }
  }
  return { mode: 'cloud', lang: 'es-CO' };
}
async function dictOpen(k) {
  try { Dict.st?.rec?.abort(); } catch (e) {}
  Dict.st = { k, stage: 'check', text: '', interim: '', h: nowHM(), date: today(), listening: false };
  dictPaint(); $('#dict-' + k)?.scrollIntoView({ block: 'nearest' });
  const d = Dict.st;
  if (IN_CLAUDE) { d.stage = 'blocked'; return dictPaint(); }
  if (!SRClass) { d.stage = 'none'; return dictPaint(); }
  if (typeof SRClass.available !== 'function') {
    // Navegador sin dictado local (p. ej. Safari): no se puede garantizar procesamiento en el equipo.
    Object.assign(d, { mode: 'cloud', lang: 'es-CO' });
    if (S.settings.voiceLocalOnly) { d.stage = 'localonly'; return dictPaint(); }
    if (!S.settings.voiceCloudOk) { d.stage = 'consent'; return dictPaint(); }
    d.stage = 'ready'; return dictListen();
  }
  Object.assign(d, await dictCheck());
  if (Dict.st !== d) return;
  if (d.mode === 'local') { d.stage = 'ready'; return dictListen(); }
  if (d.mode === 'download') { d.stage = 'download'; return dictPaint(); }
  if (S.settings.voiceLocalOnly) { d.stage = 'localonly'; return dictPaint(); }
  if (!S.settings.voiceCloudOk) { d.stage = 'consent'; return dictPaint(); }
  d.stage = 'ready'; dictListen();
}
function dictListen() {
  const d = Dict.st; if (!d || !SRClass) return;
  d.error = ''; d.interim = '';
  const rec = new SRClass();
  rec.lang = d.lang || 'es-CO'; rec.continuous = false; rec.interimResults = true; rec.maxAlternatives = 1;
  if (d.mode === 'local') { try { rec.processLocally = true; } catch (e) {} }
  rec.onresult = (ev) => {
    let fin = '', interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) fin += r[0].transcript; else interim += r[0].transcript; }
    if (fin.trim()) {
      d.text = (d.text.trim() ? d.text.trim() + ' ' : '') + fin.trim();
      const ta = $('#dict-text'); if (ta) ta.value = d.text;
      const ab = $('#dict-addbtn'); if (ab) ab.disabled = false;
    }
    d.interim = interim; const il = $('#dict-interim'); if (il) il.textContent = interim;
  };
  rec.onerror = (ev) => { if (ev.error === 'aborted') return; d.error = DICT_ERR[ev.error] || ('Error de dictado: ' + ev.error); };

}
async function dictInstall() {
  const d = Dict.st; if (!d) return;
  d.stage = 'installing'; dictPaint();
  let ok = false; try { ok = await SRClass.install({ langs: [d.lang], processLocally: true }); } catch (e) { ok = false; }
  if (Dict.st !== d) return;
  if (ok) { d.mode = 'local'; d.stage = 'ready'; dictListen(); toast('Voz en español instalada. El dictado ya funciona dentro del dispositivo.'); }
  else { d.mode = 'cloud'; d.stage = S.settings.voiceLocalOnly ? 'localonly' : 'consent'; dictPaint(); toast('No se pudo descargar la voz en español en este dispositivo.'); }
}
function dictAdd() {
  const d = Dict.st; if (!d) return;
  let t = (d.text || '').replace(/\s+/g, ' ').trim(); if (!t) return;
  t = t.charAt(0).toUpperCase() + t.slice(1); if (!/[.!?]$/.test(t)) t += '.';

  const i = arr.findIndex((r) => !r.a);
  if (i < 0) { if (arr.length >= fd.max) { toast('El formato ya tiene todas sus filas ocupadas.'); return; } arr.push(row); } else arr[i] = { ...arr[i], ...row };
  try { d.rec?.abort(); } catch (e) {}

function croquisHTML(f) {
  const has = !!(f.croquis && f.croquis.data);
  return `<div class="croq full">${has ? `<img src="${f.croquis.data}" alt="Croquis del incidente">` : '<p class="hint">Aún no hay imagen del croquis.</p>'}
